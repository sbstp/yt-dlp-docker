name: Cron
on:
  schedule:
    - cron: "15 */12 * * *" # Twice a day
  workflow_dispatch:
jobs:
  check-for-updates:
    runs-on: ubuntu-26.04
    permissions: write-all
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT }}

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: pip install requests
      - run: python ci/update.py

      - name: Push changes
        uses: ad-m/github-push-action@v1.3.0
        with:
          tags: true
          force: true
